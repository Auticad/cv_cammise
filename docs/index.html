<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
        content="CV di Pietro Cammise — AI Student, Power BI, Python, SQL Server">

  <!-- Open Graph (anteprima LinkedIn/WhatsApp) -->
  <meta property="og:title"       content="Pietro Cammise — CV">
  <meta property="og:description"  content="Studente AI, Power BI, Python, SQL Server">
  <meta property="og:url"
        content="https://pietrocammise.dev">
  <meta property="og:type"         content="profile">

  <title>Pietro Cammise — CV</title>

  <style>
    :root {
      --accent: #e6a817;
      --dark:   #1a1a1a;
      --muted:  #555;
      --bg:     #fafafa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--dark);
      color: #fff;
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header h1 span { color: var(--accent); }

    .tagline {
      color: #bbb;
      font-size: 0.95rem;
      margin-top: 0.4rem;
    }

    /* ── BOTTONI ── */
    .cta-group {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1.25rem;
    }

    .btn {
      display: inline-block;
      padding: 0.55rem 1.4rem;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-outline {
      border: 2px solid var(--accent);
      color: var(--accent);
      background: transparent;
    }

    /* ── VIEWER PDF ── */
    .pdf-container {
      flex: 1;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    object.pdf-viewer {
      width: 100%;
      max-width: 860px;
      height: 80vh;
      border: none;
      display: block;
    }

    /* ── FALLBACK (mobile/browser senza plugin PDF) ── */
    .pdf-fallback {
      display: none;         /* nascosto se object funziona */
      text-align: center;
      padding: 2rem;
      background: #fff;
      border-radius: 6px;
      max-width: 480px;
      border: 2px dashed var(--accent);
    }

    .pdf-fallback p { color: var(--muted); margin-bottom: 1rem; }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      padding: 1rem;
      border-top: 1px solid #e0e0e0;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      object.pdf-viewer { height: 60vh; }
      header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Pietro <span>Cammise</span></h1>
  <p class="tagline">Studente AI · Power BI · Python · SQL Server</p>

  <div class="cta-group">
    <a href="CV_Pietro_Cammise.pdf"
       download
       class="btn btn-primary">
      ⬇ Scarica CV
    </a>
    <a href="https://github.com/Auticad"
       target="_blank"
       rel="noopener"
       class="btn btn-outline">
      GitHub
    </a>
  </div>
</header>

<main class="pdf-container">

  <!-- Viewer primario: funziona su Chrome/Edge/Firefox desktop -->
  <object
    class="pdf-viewer"
    data="CV_Pietro_Cammise.pdf"
    type="application/pdf"
    aria-label="CV Pietro Cammise in formato PDF">

    <!-- Fallback se il browser non gestisce PDF inline -->
    <div class="pdf-fallback">
      <p>Il tuo browser non visualizza PDF inline.</p>
      <a href="CV_Pietro_Cammise.pdf"
         download
         class="btn btn-primary">
        ⬇ Scarica il CV
      </a>
    </div>
  </object>

</main>

<footer>
  © 2026 Pietro Cammise ·
  <a href="https://github.com/Auticad/cv_cammise">
    Sorgente su GitHub
  </a>
</footer>

</body>
</html>
